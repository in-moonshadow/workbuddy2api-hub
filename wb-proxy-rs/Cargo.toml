[workspace]
resolver = "2"
members = ["crates/storage", "crates/api", "crates/identity", "crates/gateway"]

[workspace.package]
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
md-5 = "0.10"
regex = "1"
