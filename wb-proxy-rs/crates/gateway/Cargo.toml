[package]
name = "wb-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde_json.workspace = true
md-5.workspace = true
regex.workspace = true
chrono.workspace = true
# 池装载的 JWT 派生（jwt_uid/jwt_exp/detect_realm_from_token）——spec :50 依赖链
# identity → gateway，gateway 在 M3 Task 5 首次用到 identity
wb-identity = { path = "../identity" }
getrandom = "0.2"
# 并发闸 acquire 超时（tokio::time）与 Semaphore——网关 async 运行时基础设施
# rt：acp.rs 的 tokio::spawn（后台读 SSE 流）需要运行时句柄
tokio = { version = "1", features = ["sync", "time", "rt"] }
# 出站 HTTP（M3 Task 4 授权）：rustls 免系统 OpenSSL 依赖；stream 供 SSE 读
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
# 契约测试用 mock 上游（M3 授权），绝不向真实上游发请求
wiremock = "0.6"
# 池装载/路由测试的临时账号目录（storage crate 同款）
tempfile = "3"
# 测试里构造最小签名 JWT 的 base64url 编码
base64.workspace = true