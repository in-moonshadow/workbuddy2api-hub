[package]
name = "wb-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.7", features = ["macros"] }
# sync：ConcurrencyGate 的 Semaphore 与 AccountPool 的进程级 Mutex 在 rx
# 任务内跨 await 持有；time：ConcurrencyGate::acquire 的槽位等待超时。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time"] }
serde_json.workspace = true
base64.workspace = true
getrandom = "0.2"
# SSE 响应体：axum 的 `Body::from_stream` 要求流实现 `futures_core::Stream`，
# 而 tokio 的 mpsc `Receiver` 不实现它（tokio 有自己的 `tokio::stream::Stream`），
# 故本 crate 需要能**具名**该 trait 才能手写一层薄适配。
# futures-core 已在依赖树里（axum-core 依赖它），此处只把它提为直接依赖，
# 不引入新的第三方 crate。
futures-core = "0.3"
# 非流式路径要读上游 SSE body 再聚合（对齐 Python _chat_nonstream_response）：
# Outcome::Served 带的是 reqwest::Response，api 层需能具名其类型。
reqwest = { version = "0.12", default-features = false }
# 面板口令：PBKDF2-HMAC-SHA256，摘要必须与 Python wb_settings._digest 逐字节
# 一致（sha2 提供 SHA-256，pbkdf2 的 hmac 特性提供 PBKDF2-HMAC 构造）。
pbkdf2 = { version = "0.13", features = ["sha2"] }
sha2 = "0.11"
# 摘要恒定时间比较（对齐 Python hmac.compare_digest）。
subtle = "2"
# 可信代理的 IP / CIDR 解析（对齐 Python ipaddress.ip_network）。
ipnet = "2"
wb-storage = { path = "../storage" }
wb-identity = { path = "../identity" }
wb-gateway = { path = "../gateway" }
wb-tasks = { path = "../tasks" }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
wb-storage = { path = "../storage" }
# 契约测试用 wiremock 起假上游，经 Config.upstream_base_url 注入；
# 绝不向真实上游发请求。
wiremock = "0.6"
